<footer class="book-footer">
  <nav class="book-footer__nav" aria-label="Adjacent chapters">
    {% if page.previous_page %}<a href="{{ page.previous_page.url | url }}"><span>Previous section</span>{{ page.previous_page.title }}</a>{% else %}<div></div>{% endif %}
    {% if page.next_page %}<a href="{{ page.next_page.url | url }}"><span>Next section</span>{{ page.next_page.title }}</a>{% endif %}
  </nav>
  <div class="book-footer__meta"><span>{{ config.site_name }}</span><a href="{{ config.repo_url }}">camianunez / source and experiments</a></div>
</footer>
